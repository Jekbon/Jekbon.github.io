<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-label="证书续期八阶段状态机：前置检查到健康检查的主链，Phase 3 取 Lease 锁，Phase 5 与 6 失败触发全量回滚并可重启加载旧证书">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e25822"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #e6e6e6; }
      .t  { font-size: 14.5px; }
      .ts { font-size: 12px; fill: #a4a4a4; }
      .box  { fill: #1c1d20; stroke: #e25822; stroke-width: 1.4; rx: 6; }
      .boxg { fill: #1c1d20; stroke: #6a6a6a; stroke-width: 1.3; rx: 6; }
      .ln   { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
      .lnr  { stroke: #e25822; stroke-width: 1.5; fill: none; }
      .lnd  { stroke: #8a8a8a; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="620" rx="12" fill="#16171a"/>

  <rect class="box" x="90" y="26"  width="330" height="52"/>
  <text class="t" x="255" y="48" text-anchor="middle">Phase 1 · 前置检查</text>
  <text class="ts" x="255" y="66" text-anchor="middle">paused? 黑窗时间?（forceRenew 可跳过黑窗）</text>
  <rect class="box" x="90" y="98"  width="330" height="52"/>
  <text class="t" x="255" y="120" text-anchor="middle">Phase 2 · 检查证书</text>
  <text class="ts" x="255" y="138" text-anchor="middle">解析 PEM 与 kubeconfig，算剩余天数</text>
  <rect class="box" x="90" y="170" width="330" height="52"/>
  <text class="t" x="255" y="192" text-anchor="middle">Phase 3 · HA 协调</text>
  <text class="ts" x="255" y="210" text-anchor="middle">获取 Lease 锁，defer 释放</text>
  <rect class="box" x="90" y="242" width="330" height="52"/>
  <text class="t" x="255" y="264" text-anchor="middle">Phase 4 · 备份</text>
  <text class="ts" x="255" y="282" text-anchor="middle">pki/ 与 *.conf 全量复制，先于一切写操作</text>
  <rect class="box" x="90" y="314" width="330" height="52"/>
  <text class="t" x="255" y="336" text-anchor="middle">Phase 5 · 续期</text>
  <text class="ts" x="255" y="354" text-anchor="middle">kubeadm certs renew 逐个执行</text>
  <rect class="box" x="90" y="386" width="330" height="52"/>
  <text class="t" x="255" y="408" text-anchor="middle">Phase 6 · 验证</text>
  <text class="ts" x="255" y="426" text-anchor="middle">解析新证书：有效期 + CA 链</text>
  <rect class="box" x="90" y="458" width="330" height="52"/>
  <text class="t" x="255" y="480" text-anchor="middle">Phase 7 · 重启</text>
  <text class="ts" x="255" y="498" text-anchor="middle">按映射轮转 static pod，staggerDelay 间隔</text>
  <rect class="box" x="90" y="530" width="330" height="52"/>
  <text class="t" x="255" y="552" text-anchor="middle">Phase 8 · 健康检查</text>
  <text class="ts" x="255" y="570" text-anchor="middle">/healthz + etcdctl endpoint health</text>

  <path class="ln" d="M255,78 L255,98" marker-end="url(#ar)"/>
  <path class="ln" d="M255,150 L255,170" marker-end="url(#ar)"/>
  <path class="ln" d="M255,222 L255,242" marker-end="url(#ar)"/>
  <path class="ln" d="M255,294 L255,314" marker-end="url(#ar)"/>
  <path class="ln" d="M255,366 L255,386" marker-end="url(#ar)"/>
  <path class="ln" d="M255,438 L255,458" marker-end="url(#ar)"/>
  <path class="ln" d="M255,510 L255,530" marker-end="url(#ar)"/>

  <rect class="boxg" x="560" y="170" width="330" height="66"/>
  <text class="t" x="725" y="194" text-anchor="middle">Lease 锁（kube-system）</text>
  <text class="ts" x="725" y="214" text-anchor="middle">600s 有效 · 60s 续约 · CAS 抢占</text>
  <text class="ts" x="725" y="230" text-anchor="middle">他人持有 → requeue 2m，不阻塞</text>
  <path class="ln" d="M420,196 L560,196" marker-end="url(#ar)"/>

  <rect class="boxg" x="560" y="330" width="330" height="96"/>
  <text class="t" x="725" y="354" text-anchor="middle">全量回滚（非部分保留）</text>
  <text class="ts" x="725" y="374" text-anchor="middle">Phase 5 任一失败 / Phase 6 验证失败</text>
  <text class="ts" x="725" y="392" text-anchor="middle">→ 从备份恢复全部证书</text>
  <text class="ts" x="725" y="410" text-anchor="middle">避免新旧证书混用状态</text>
  <path class="lnr" d="M420,340 L560,352" marker-end="url(#arr)"/>
  <path class="lnr" d="M420,412 L560,400" marker-end="url(#arr)"/>
  <path class="lnd" d="M725,426 L725,484 L420,484" marker-end="url(#ar)"/>
  <text class="ts" x="740" y="462">autoRestart 时重跑 Phase 7</text>
  <text class="ts" x="740" y="478">让组件加载回旧证书</text>

  <rect class="boxg" x="560" y="530" width="330" height="52"/>
  <text class="t" x="725" y="552" text-anchor="middle">Healthy / Error</text>
  <text class="ts" x="725" y="570" text-anchor="middle">重新 CheckAll → 动态 requeue</text>
  <path class="ln" d="M420,556 L560,556" marker-end="url(#ar)"/>

  <text class="ts" x="90" y="608">动态巡检：minDays &gt; 90 → 24h · &gt; 30 → 12h · &gt; 7 → 6h · 否则 1h · 检查出错 → 1h 兜底</text>
</svg>
