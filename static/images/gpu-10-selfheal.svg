<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="自愈系统链路：告警源经 Webhook 网关到诊断引擎与处置动作库，最终工单闭环，旁挂知识库与度量系统">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #e6e6e6; }
      .t  { font-size: 14.5px; }
      .ts { font-size: 12px; fill: #a4a4a4; }
      .box { fill: #1c1d20; stroke: #e25822; stroke-width: 1.4; rx: 6; }
      .ln  { stroke: #8a8a8a; stroke-width: 1.4; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="340" rx="12" fill="#16171a"/>

  <rect class="box" x="30"  y="50" width="150" height="110"/>
  <text class="t" x="105" y="78" text-anchor="middle">告警源</text>
  <text class="ts" x="105" y="102" text-anchor="middle">Prometheus</text>
  <text class="ts" x="105" y="122" text-anchor="middle">DCGM</text>
  <text class="ts" x="105" y="142" text-anchor="middle">Syslog</text>

  <rect class="box" x="215" y="50" width="160" height="110"/>
  <text class="t" x="295" y="78" text-anchor="middle">Webhook 网关</text>
  <text class="ts" x="295" y="102" text-anchor="middle">(HTTP / Kafka)</text>
  <text class="ts" x="295" y="126" text-anchor="middle">归一化 + 去重</text>

  <rect class="box" x="410" y="50" width="160" height="110"/>
  <text class="t" x="490" y="78" text-anchor="middle">诊断引擎</text>
  <text class="ts" x="490" y="102" text-anchor="middle">(规则 + ML)</text>
  <text class="ts" x="490" y="126" text-anchor="middle">定位根因</text>

  <rect class="box" x="605" y="50" width="160" height="110"/>
  <text class="t" x="685" y="78" text-anchor="middle">处置动作库</text>
  <text class="ts" x="685" y="102" text-anchor="middle">(Ansible / K8s)</text>
  <text class="ts" x="685" y="126" text-anchor="middle">自动修复</text>

  <rect class="box" x="800" y="50" width="130" height="110"/>
  <text class="t" x="865" y="78" text-anchor="middle">工单闭环</text>
  <text class="ts" x="865" y="102" text-anchor="middle">(Jira)</text>
  <text class="ts" x="865" y="126" text-anchor="middle">人工兜底</text>

  <path class="ln" d="M180,105 L215,105" marker-end="url(#ar)"/>
  <path class="ln" d="M375,105 L410,105" marker-end="url(#ar)"/>
  <path class="ln" d="M570,105 L605,105" marker-end="url(#ar)"/>
  <path class="ln" d="M765,105 L800,105" marker-end="url(#ar)"/>

  <rect class="box" x="410" y="230" width="160" height="76"/>
  <text class="t" x="490" y="260" text-anchor="middle">知识库</text>
  <text class="ts" x="490" y="284" text-anchor="middle">(历史案例)</text>
  <rect class="box" x="605" y="230" width="160" height="76"/>
  <text class="t" x="685" y="260" text-anchor="middle">度量系统</text>
  <text class="ts" x="685" y="284" text-anchor="middle">(MTTR / 成功率)</text>

  <path class="ln" d="M490,160 L490,230" marker-end="url(#ar)"/>
  <path class="ln" d="M685,160 L685,230" marker-end="url(#ar)"/>
</svg>
