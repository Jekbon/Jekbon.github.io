<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="GB200/GB300 NVL72 的 Compute Tray 结构：每个 Tray 内 Grace CPU 下挂 B200 GPU，NVL72 机架共 18 个 Tray">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #e6e6e6; }
      .t  { font-size: 15px; }
      .ts { font-size: 12.5px; fill: #a4a4a4; }
      .ttl{ font-size: 16px; font-weight: 600; fill: #e25822; }
      .box  { fill: #1c1d20; stroke: #e25822; stroke-width: 1.4; rx: 6; }
      .zone { fill: #141518; stroke: #4a4b50; stroke-width: 1.2; stroke-dasharray: 6 4; rx: 10; }
      .ln   { stroke: #8a8a8a; stroke-width: 1.4; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="440" rx="12" fill="#16171a"/>

  <rect class="zone" x="60" y="26" width="620" height="388"/>
  <text class="ttl" x="370" y="56" text-anchor="middle">Compute Tray（×18 per NVL72 rack）</text>

  <rect class="box" x="140" y="80" width="180" height="64"/>
  <text class="t" x="230" y="106" text-anchor="middle">Grace CPU</text>
  <text class="ts" x="230" y="128" text-anchor="middle">ARM 主处理器</text>
  <rect class="box" x="420" y="80" width="180" height="64"/>
  <text class="t" x="510" y="106" text-anchor="middle">Grace CPU</text>
  <text class="ts" x="510" y="128" text-anchor="middle">ARM 主处理器</text>

  <path class="ln" d="M230,144 L230,186" marker-end="url(#ar)"/>
  <path class="ln" d="M510,144 L510,186" marker-end="url(#ar)"/>

  <rect class="box" x="140" y="186" width="180" height="64"/>
  <text class="t" x="230" y="212" text-anchor="middle">B200 GPU</text>
  <text class="ts" x="230" y="234" text-anchor="middle">NVLink 下行</text>
  <rect class="box" x="420" y="186" width="180" height="64"/>
  <text class="t" x="510" y="212" text-anchor="middle">B200 GPU</text>
  <text class="ts" x="510" y="234" text-anchor="middle">NVLink 下行</text>

  <path class="ln" d="M230,250 L230,292" marker-end="url(#ar)"/>
  <path class="ln" d="M510,250 L510,292" marker-end="url(#ar)"/>

  <rect class="box" x="140" y="292" width="180" height="64"/>
  <text class="t" x="230" y="318" text-anchor="middle">B200 GPU</text>
  <rect class="box" x="420" y="292" width="180" height="64"/>
  <text class="t" x="510" y="318" text-anchor="middle">B200 GPU</text>

  <text class="ts" x="720" y="120">每 Tray：2 Grace + 4 B200</text>
  <text class="ts" x="720" y="150">整 rack：18 Tray = 72 GPU</text>
  <text class="ts" x="720" y="180">GPU 间走 NVLink 交换，</text>
  <text class="ts" x="720" y="206">跨 Tray 不落地 PCIe/网络</text>
  <text class="ts" x="720" y="248">运维要点：液冷、NVSwitch</text>
  <text class="ts" x="720" y="274">托盘级故障域、固件联动</text>
</svg>
