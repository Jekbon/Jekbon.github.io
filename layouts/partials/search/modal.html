<div class="search-modal" data-search-modal role="dialog" aria-modal="true" aria-labelledby="search-input" hidden>
    <div class="search-panel">
        <div class="search-input-wrap">
            <span class="prompt" aria-hidden="true">›</span>
            <input
                id="search-input"
                type="search"
                class="search-input"
                placeholder="搜索文章…"
                autocomplete="off"
                spellcheck="false"
                data-search-input
            >
        </div>
        <div class="search-results" data-search-results>
            <div class="search-empty">输入关键词开始搜索</div>
        </div>
        <div class="search-foot">
            <span><span class="kbd">↑</span><span class="kbd">↓</span> 选择</span>
            <span><span class="kbd">↵</span> 打开</span>
            <span><span class="kbd">esc</span> 关闭</span>
        </div>
    </div>
</div>
