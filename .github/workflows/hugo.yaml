name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 与本地保持一致，避免"本地能构建线上不能"
      HUGO_VERSION: 0.170.1
      NODE_VERSION: '22'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # 必须，否则 themes/rusty-poison 是空目录
          fetch-depth: 0

      - name: Install Hugo CLI (extended)
        run: |
          wget -O "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # 主题用 css.TailwindCSS 管道，需要 tailwindcss / pagefind 在 PATH 里。
      # 它们装在 node_modules/.bin，只有经 npm script 调用时 npm 才会把该目录加进 PATH，
      # 所以构建必须走 npm run build，直接跑 hugo 会报 tailwindcss not found。
      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site + Pagefind index
        env:
          HUGO_ENVIRONMENT: production
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          # Hugo 会用 HUGO_BASEURL 覆盖配置里的 baseURL
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url }}/
          TZ: Asia/Shanghai
        run: npm run build

      - name: Show output
        run: |
          echo "--- public/ ---"; ls public | head -20
          echo "--- pagefind 索引 ---"; ls public/pagefind 2>/dev/null | head -5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
