baseURL = "https://jekbon.github.io/"
locale = "zh-CN"
# 决定 <html lang> 与 Pagefind 的中文分词；不设会退化成 en，中文搜索直接失效
defaultContentLanguage = "zh"
title = "Jekbon's Blog"
theme = "rusty-poison"
enableEmoji = true
enableRobotsTXT = true
enableGitInfo = true          # 侧栏状态块的"版本"行需要它读取 git commit

[pagination]
pagerSize = 10

# minify 会压坏 RSS/XML
[minify]
disableXML = true

[params]
  brand = "Jekbon's Blog"
  description = "DevOps、云原生与基础设施实践笔记"
  tagline = "// DevOps · Cloud Native"
  favicon = "/favicon.png"
  showDarkLight = true          # 顶栏明暗切换按钮
  hideToc = false               # 默认显示右侧目录

  front_page_content = ["posts"]  # 首页列出哪个 section（等同 Papermod 的 mainSections）

  menu = [
    {Name = "文章", URL = "/posts/", HasChildren = false},
    {Name = "系列", URL = "/series/", HasChildren = false},
    {Name = "标签", URL = "/tags/", HasChildren = false},
  ]

  github_url = "https://github.com/Jekbon"
  rss_icon    = true
  rss_section = "posts"

[taxonomies]
  series = "series"
  tags   = "tags"

# 相关文章推荐权重
[related]
  threshold = 80
  includeNewer = true
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "series"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
  [markup.highlight]
    codeFences = true
    noClasses = false          # 主题靠 CSS class 上色，必须 false
    style = "monokai"
    tabWidth = 2
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true            # 允许 Markdown 内嵌 HTML
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true          # 数学公式透传给 KaTeX
        [markup.goldmark.extensions.passthrough.delimiters]
          block  = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

# 必需：Hugo 默认 exec 白名单没有 tailwindcss，不加这段首次构建直接
# access denied: "tailwindcss" is not whitelisted in policy "security.exec.allow"
# 注意 allow 会替换默认值，所以官方条目要一并写上；且 [security] 不从主题合并
[security]
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
